[project]
name = "wn2-typhoon"
version = "0.1.0"
description = "WeatherNext 2 (FGN) forecast of Typhoon Krovanh (2026, JMA T2624) from ERA5 initial conditions, compared with the JMA best track"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Syota Sasaki", email = "syota.sasaki@earthsea-wizard.com" }]
dependencies = [
    "numpy",
    "pandas",
    "xarray<=2026.2.0",  # upper bound required by weathernext; keep Mac and pod aligned
    "netcdf4",
    "pyyaml",
    "cdsapi",
]

[dependency-groups]
# The model runtime itself. Shared by the Mac (CPU jax, smoke runs) and the pod.
model = [
    "weathernext @ git+https://github.com/google-deepmind/weathernext.git@v0.3.0",
    "google-cloud-storage",  # anonymous access to gs://dm_graphcast
    "h5netcdf",
    "zarr",
]
# RunPod (Linux, H100). The Linux-only marker keeps the Mac lock free of CUDA wheels.
gpu = [
    { include-group = "model" },
    "jax[cuda12] ; sys_platform == 'linux'",
]
# Mac: run the 1 deg Mini model on the CPU backend to exercise the pipeline.
cpu = [
    { include-group = "model" },
    "jax",
]
# Mac: plots and best-track comparison.
analysis = [
    "matplotlib",
    "cartopy",
    "jupyterlab",
    "zarr",
]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
default-groups = ["dev"]
# weathernext 0.3.0 lists "colabtools" in install_requires, but the PyPI project
# of that name is an unrelated third-party package (0.0.1), not Google's, and no
# module under weathernext/ imports it or google.colab. The always-false marker
# drops it from the resolution on every platform.
override-dependencies = ["colabtools ; python_version < '3'"]
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wn2_typhoon"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
