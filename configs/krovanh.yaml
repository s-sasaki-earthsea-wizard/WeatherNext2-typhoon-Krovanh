# Experiment configuration: Typhoon Krovanh, 2026 (JMA number 2624).
# All timestamps are UTC, ISO 8601.

# Storm facts from the JMA preliminary position table (T2624.pdf), which runs
# from formation to the end of typhoon status. Times converted from JST.
storm:
  jma_number: "2624"
  name: KROVANH
  formation_time: "2026-09-01T00:00"    # 09 JST 1 Sep, 22.6N 131.9E, 996 hPa
  peak_time: "2026-09-03T00:00"         # 09 JST 3 Sep, 26.3N 130.5E, 985 hPa
  # Weakened back to a tropical depression; it did NOT become extratropical.
  # This is the last row of the position table, so the comparison window ends
  # here even though the forecast runs to 240 h.
  depression_time: "2026-09-07T00:00"   # 09 JST 7 Sep, 26.0N 132.0E
  dissipation_time: "2026-09-10T00:00"  # 09 JST 10 Sep, from press reports

# Reference track. Two sources, same storm, different release schedules.
besttrack:
  # Official post-analysis, the one the comparison will finally use. Includes
  # the tropical-depression stage before formation (grade 2 rows), which the
  # preliminary PDF does not. As of 2026-09-16 it stops at storm 2605
  # (19 May 2026), i.e. roughly 3.7 months behind; expect 2624 around the turn
  # of the year.
  csv_url: "https://www.data.jma.go.jp/typhoon/position_table/table2026.csv"
  # Preliminary values, available now. 3-hourly JST, pressure in hPa and
  # maximum wind in m/s (the CSV uses knots).
  preliminary_pdf_url: "https://www.data.jma.go.jp/typhoon/data/T2624.pdf"

model:
  name: WeatherNext2            # WeatherNext2 | WeatherNextCyclones
  split: "2025"                 # "<2025": trained on data through 2024
  checkpoint: model1            # model1 .. model4; null for the Mini models
  gcs_bucket: dm_graphcast
  # Neither the input variable list nor the attention implementation lives
  # here. The first is read from the checkpoint task config (make model-spec);
  # the second is a property of the jax backend, see ATTENTION_TYPE_BY_BACKEND
  # in src/wn2_typhoon/inference/load_model.py.

# Local pipeline check on the Mac. The 1 deg Mini checkpoint is small enough to
# run on the CPU backend: 0.22 GiB of weights against 0.72 GiB for WeatherNext2,
# which needs an H100 even on GPU.
smoke:
  name: WeatherNextCyclones_Mini
  split: "2024"
  checkpoint: null
  resolution: "1.0"
  sample_init: "2024-10-07 00:00:00"   # the public sample forecast
  sample_steps: "04"                   # one of 01, 04, 12, 20, 30

forecast:
  step_hours: 6
  lead_hours: 240               # 10 days = 40 autoregressive steps
  num_members: 8
  seed: 0

# One forecast run per case. Add entries to try more initialization times.
#
# seed_position seeds the cyclone tracker with an observed centre, as
# [lat, lon_east]. Null means the tracker has to find the storm itself
# (cyclogenesis mode), which is the point of the pre-formation case: no JMA
# position exists at that time, because the preliminary table starts at
# formation and the post-analysis CSV that carries the depression stage is
# months away.
# Five initialization times spanning 12 h either side of formation, so that
# skill can be read against how much of the storm the analysis had already
# seen. Consecutive cases share an ERA5 frame (each needs t-6h and t), so the
# five cases cost six frames rather than ten.
#
# observed_position is the JMA preliminary position at init_time where one
# exists, null before formation because the preliminary table starts there.
# It is reference data only: tracking runs in cyclogenesis mode for every
# case, so no observed value enters a forecast track. See
# docs/requirements.md decision 12.
cases:
  - id: init-2026-08-31T12
    init_time: "2026-08-31T12:00"   # 21 JST 31 Aug, twelve hours before formation
    note: before formation; no published position exists yet
    observed_position: null
  - id: init-2026-08-31T18
    init_time: "2026-08-31T18:00"   # 03 JST 1 Sep, six hours before formation
    note: before formation; no published position exists yet
    observed_position: null
  - id: init-2026-09-01T00
    init_time: "2026-09-01T00:00"   # 09 JST 1 Sep, formation
    note: at formation
    observed_position: [22.6, 131.9]
  - id: init-2026-09-01T06
    init_time: "2026-09-01T06:00"   # 15 JST 1 Sep, six hours after formation
    note: after formation
    observed_position: [22.3, 131.4]
  - id: init-2026-09-01T12
    init_time: "2026-09-01T12:00"   # 21 JST 1 Sep, twelve hours after formation
    note: after formation
    observed_position: [22.4, 131.7]

output:
  # A global member is 17.1 GB (103 fields x 40 steps at 0.25 deg) and is never
  # stored. Tracking runs on the global fields in memory; only this crop is
  # written, with every variable and level kept: 0.33 GB per member,
  # 2.6 GB per 8-member case.
  #
  # Covers Taiwan, the coastal provinces from Shantou to Shanghai, the East
  # China Sea, the Nansei islands and the whole Japanese archipelago out to
  # Etorofu, with 7 degrees of margin south of the observed genesis point.
  # The observed track fits in 22.3-29.8N, 126.5-132.6E. Widening it is a
  # config edit; tracks are never clipped by it because the tracker sees the
  # global field.
  region:
    lat: [15, 50]
    lon: [115, 150]
